  - slug: "decret-bacs"
    url: "/services/decret-bacs/"
    title: "Décret BACS : obligations, échéances et financement CEE"
    primary_keyword: "décret bacs"
    volume: 3600
    kd: 13
    secondary_keywords: ["décret bacs obligation", "décret bacs 2025", "décret bacs qui est concerné", "décret bacs 70 kw", "accompagnement décret bacs", "décret bacs et décret tertiaire", "décret bacs pdf", "loi bacs"]
