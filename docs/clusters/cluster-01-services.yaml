# Positionnement (impératif) : Oteria est mandataire CEE ; étudie, sélectionne et met en relation avec
#   des installateurs partenaires ; sécurise le dossier CEE ; « transparent, gratuit pour le client » (rien de plus : JAMAIS expliquer comment Oteria est rémunéré, ni commission, ni obligé payeur) ;
#   aucun délai annoncé ; exemples = exemples chiffrés illustratifs, jamais présentés comme un vrai client.
# Faits réglementaires : chaque seuil / date / sanction sourcé (Légifrance, article + date) au moment de la rédaction.
# Angle commun (gain d'information) : lien obligation réglementaire ↔ financement CEE, chiffré.

