    competition: "faible"
    search_intent: "informationnel"
    content_type: "guide"
    word_count_target: 2200
    serp_notes: "Report 70-290 kW du 01/01/2027 au 01/01/2030 (décret n° 2025-1343 du 26/12/2025) — plusieurs concurrents affichent encore 2027 = angle « page à jour ». Pas de sanction propre ; dérogation TRI > 10 ans ; inspection / 5 ans. BAT-TH-116 : classe A ou B seulement (classe C conforme BACS NON éligible = piège à expliquer), tertiaire uniquement (pas d'industrie/agri), engagée avant 01/01/2030. Revérifier les forfaits dans ../referentiel-cee avant tout calcul (cohérence avec l'exemple 5 000 m² du hub GTB)."
    outline: ["Ce que le décret BACS impose", "Bâtiments concernés et échéances (290 kW / 70 kW → 2030)", "Exigences du système d'automatisation (classes : résumé + lien GTB)", "Inspections, dérogations, sanctions", "Financer la GTB avec la prime CEE BAT-TH-116 (exemple chiffré)", "BACS et décret tertiaire", "Notre accompagnement", "FAQ"]
    cannibalisation: "/expertises/gtb-gtc/ garde « classe gtb décret bacs » et « décret bacs gtb » (technique)."
    links_to: ["/expertises/gtb-gtc/", "/expertises/gtb-gtc/prime-cee/", "/services/decret-tertiaire/", "/services/financement-operations/"]
    status: pending

